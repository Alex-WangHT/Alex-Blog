site_name: Alex Blog
site_url: https://alex-wanght.github.io/Alex-Blog/
repo_url: https://github.com/Alex-WangHT/Alex-Blog
repo_name: Alex-WangHT/Alex-Blog

# MkDocs 标准配置：数学公式 (MathJax) + 注解 (Admonitions)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['_includes', 'docs']
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - footnotes
  - toc:
      permalink: true
  - meta

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - tags
  - blog:
      blog_dir: tech-blog
      post_date_format: yyyy-MM-dd
      post_url_date_format: yyyy/MM/dd
      archive: true
      pagination_per_page: 10

# 构建期虚拟生成分类/子目录落地页（重定向到第一篇文章），不写入 docs/
hooks:
  - scripts/hook_section_landing.py

