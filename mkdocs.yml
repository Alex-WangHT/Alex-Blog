site_name: Alex Blog
site_url: https://alex-wanght.github.io/Alex-Blog/
repo_url: https://github.com/Alex-WangHT/Alex-Blog
repo_name: Alex-WangHT/Alex-Blog

# 支持数学公式 (MathJax)
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['_includes', 'docs']
  - pymdownx.superfences

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# 导航菜单（不再单独显示"首页"，点击 Alex Blog 标题即可返回）
nav:
  - 技术博客:
    - tech-blog/index.md
    - 标签分类:
      - "#Python": tech-blog/tags/Python.md
      - "#ROS2": tech-blog/tags/ROS2.md
      - "#SLAM": tech-blog/tags/SLAM.md
      - "#Transformer": tech-blog/tags/Transformer.md
      - "#数学": tech-blog/tags/数学.md
      - "#机器人": tech-blog/tags/机器人.md
      - "#概率论": tech-blog/tags/概率论.md
      - "#注意力机制": tech-blog/tags/注意力机制.md
      - "#深度学习": tech-blog/tags/深度学习.md
  - 机器人: robot/index.md
  - 人工智能: ai/index.md
  - 控制理论: control/index.md
  - 计算机: computer/index.md
  - 电子设计: electronics/index.md
  - 数学知识: math/index.md
  - 物理知识: physics/index.md

# GitHub Pages 部署设置 (部署到 gh-pages 分支)
remote_branch: gh-pages
remote_name: origin
