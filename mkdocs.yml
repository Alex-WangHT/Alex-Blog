site_name: Alex Blog
site_url: https://alex-wanght.github.io/Alex-Blog/
repo_url: https://github.com/Alex-WangHT/Alex-Blog
repo_name: Alex-WangHT/Alex-Blog

# MkDocs 标准配置：数学公式 (MathJax) + 注解 (Admonitions)
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['_includes', 'docs']
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - footnotes
  - toc:
      permalink: true
  - meta

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - tags:
      tags_file: tech-blog/tags.md
  - blog:
      blog_dir: tech-blog
      post_date_format: yyyy-MM-dd
      post_url_date_format: yyyy/MM/dd
      archive: true
      pagination_per_page: 10

# 导航菜单
nav:
  - 技术博客:
    - 全部文章: tech-blog/index.md
    - 标签索引: tech-blog/tags.md
  - 机器人:
    - 机器人: robot/index.md
    - Rigid Body Dynamic Algorithms: robot/Rigid Body Dynamic Algorithms/index.md
    - Robotics Vision and Control: robot/Robotics Vision and Control/index.md
  - 人工智能:
    - 人工智能: ai/index.md
    - Reinforcement Learning: ai/Reinforcement Learning/index.md
  - 控制理论:
    - 控制理论: control/index.md
    - Disturbance Observer based Control: control/Disturbance Observer based Control/index.md
    - Morden Control Systems: control/Morden Control Systems/index.md
  - 计算机: computer/index.md
  - 电子设计: electronics/index.md
  - 数学知识:
    - 数学知识: math/index.md
    - Information Theory: math/Information Theory/index.md
  - 物理知识:
    - 物理知识: physics/index.md
    - 理论力学: physics/理论力学/index.md

# GitHub Pages 部署设置 (部署到 gh-pages 分支)
remote_branch: gh-pages
remote_name: origin
