site_name: Alex Blog
site_url: https://alex-wanght.github.io/Alex-Blog/
repo_url: https://github.com/Alex-WangHT/Alex-Blog
repo_name: Alex-WangHT/Alex-Blog

# 支持数学公式 (MathJax)
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# 导航菜单
nav:
  - 首页: index.md
  - 技术博客: tech-blog/index.md
  - 机器人: robot/index.md
  - 人工智能: ai/index.md
  - 控制理论: control/index.md
  - 计算机: computer/index.md
  - 电子设计: electronics/index.md
  - 数学知识: math/index.md
  - 物理知识: physics/index.md

# GitHub Pages 部署设置 (部署到 gh-pages 分支)
remote_branch: gh-pages
remote_name: origin
