site_name: Alex Blog
site_url: https://alex-wanght.github.io/Alex-Blog/
repo_url: https://github.com/Alex-WangHT/Alex-Blog
repo_name: Alex-WangHT/Alex-Blog

# 支持数学公式 (MathJax) + 注解 (Admonitions) + Obsidian 兼容扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['_includes', 'docs']
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - footnotes
  - toc:
      permalink: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# 导航菜单（不再单独显示"首页"，点击 Alex Blog 标题即可返回）
nav:
  - 技术博客:
    - 标签分类:
      - "#Python": tech-blog/tags/Python.md
      - "#ROS2": tech-blog/tags/ROS2.md
      - "#SLAM": tech-blog/tags/SLAM.md
      - "#机器人": tech-blog/tags/机器人.md
      - "#概率论": tech-blog/tags/概率论.md
  - 机器人:
    - 机器人: robot/index.md
    - Rigid Body Dynamic Algorithms: robot/Rigid Body Dynamic Algorithms/index.md
    - Robotics Vision and Control: robot/Robotics Vision and Control/index.md
  - 人工智能:
    - 人工智能: ai/index.md
    - Reinforcement Learning: ai/Reinforcement Learning/index.md
  - 控制理论:
    - 控制理论: control/index.md
    - Disturbance Observer based Control: control/Disturbance Observer based Control/index.md
    - Morden Control Systems: control/Morden Control Systems/index.md
  - 计算机: computer/index.md
  - 电子设计: electronics/index.md
  - 数学知识:
    - 数学知识: math/index.md
    - Information Theory: math/Information Theory/index.md
  - 物理知识:
    - 物理知识: physics/index.md
    - 理论力学: physics/理论力学/index.md

# GitHub Pages 部署设置 (部署到 gh-pages 分支)
remote_branch: gh-pages
remote_name: origin
