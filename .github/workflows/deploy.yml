name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # 跳过由 auto-generate 机器人提交的 commit，避免无限循环
    if: "!contains(github.event.head_commit.message, '[auto-generate]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          auto-activate-base: true

      - name: Install MkDocs and dependencies
        shell: bash -l {0}
        run: |
          pip install mkdocs-material pymdown-extensions pyyaml

      - name: Generate blog index and tags
        shell: bash -l {0}
        run: python scripts/generate_blog_index.py

      - name: Commit auto-generated files
        shell: bash -l {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate blog index and tags [auto-generate]"
            git push
          fi

      - name: Deploy to GitHub Pages
        shell: bash -l {0}
        run: |
          mkdocs gh-deploy --force
